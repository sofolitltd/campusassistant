<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Campus Assistant — your all-in-one university companion in Bangladesh: courses and study resources, class routine, clubs and associations, campus marketplace, blood bank, transport, alumni and emergency contacts.">
  <meta name="keywords" content="Campus Assistant, university app Bangladesh, student app, class routine, study resources, campus marketplace, university clubs, blood bank">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://campusassistant.web.app/">

  <!-- Open Graph / social link previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Campus Assistant">
  <meta property="og:title" content="Campus Assistant — Smart assistant on Campus">
  <meta property="og:description" content="Courses, routine, clubs, marketplace, blood bank and more for university students in Bangladesh.">
  <meta property="og:url" content="https://campusassistant.web.app/">
  <meta property="og:image" content="https://campusassistant.web.app/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Campus Assistant — Smart assistant on Campus">
  <meta name="twitter:description" content="Courses, routine, clubs, marketplace, blood bank and more for university students in Bangladesh.">
  <meta name="twitter:image" content="https://campusassistant.web.app/icons/Icon-512.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Campus Assistant",
    "url": "https://campusassistant.web.app/",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Web, Android",
    "description": "All-in-one university companion for students in Bangladesh."
  }
  </script>
  <meta name="google-site-verification" content="laSM_Nd0ddR5UDhdEQzfq3sVvL4WTkXp54xLwuNUMIw" />

  <!-- Start fetching the engine + renderer before flutter_bootstrap.js even
       runs. These are the dart2wasm/skwasm build (what modern Chrome/Edge
       picks) — ~10MB that otherwise only starts downloading after the
       bootstrap script parses _flutter.buildConfig and selects a build,
       which was most of our Largest Contentful Paint cost. Browsers that
       fall back to the dart2js/canvaskit build just ignore these hints. -->
  <link rel="preload" href="main.dart.wasm" as="fetch" type="application/wasm" crossorigin>
  <link rel="modulepreload" href="main.dart.mjs">
  <link rel="preload" href="canvaskit/skwasm.wasm" as="fetch" type="application/wasm" crossorigin>
  <link rel="modulepreload" href="canvaskit/skwasm.js">

  <!-- API origin — the app calls this immediately after first frame. -->
  <link rel="preconnect" href="https://campusassistant.duckdns.org">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="campusassistant">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- cropperjs: image_cropper_for_web binds to this as a global `Cropper`
       class (see its cropper_interop.dart @JS("Cropper") extension type).
       Without these two tags the crop box/handles never render (no CSS)
       and every cropper call (rotate, crop, ...) throws since the class
       doesn't exist — the edit-profile photo cropper on web depends on
       this. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

  <title>Campus Assistant — Smart assistant on Campus</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* image_picker_for_web injects a raw <input type="file"> into a
       <flt-image-picker-inputs> element on document.body for every pick
       (gallery/camera) and leaves it there unstyled — it expects the host
       page to hide it. Without this it renders as a stray "Choose File"
       control in the corner of the page. */
    flt-image-picker-inputs {
      display: none !important;
    }
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
    }
    #app-loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-top-color: #4DB6AC;
      border-radius: 50%;
      animation: app-loading-spin 0.8s linear infinite;
    }
    @keyframes app-loading-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <noscript>
    <h1>Campus Assistant</h1>
    <p>Your all-in-one university companion in Bangladesh: courses and study resources, class routine, clubs and associations, campus marketplace, blood bank, transport, alumni and emergency contacts. Please enable JavaScript to use the app.</p>
  </noscript>
  <div id="app-loading">
    <div class="spinner"></div>
  </div>

  <!-- Syncfusion PDF Viewer web integration (PdfJs 4.0+):
       https://pub.dev/packages/syncfusion_flutter_pdfviewer#web -->
  <script type="module" async>
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.worker.min.mjs';
  </script>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Flutter web dispatches this once the first frame has rendered.
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('app-loading');
      if (loading) loading.remove();
    });
  </script>
</body>
</html>
