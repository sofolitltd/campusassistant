name: campusassistant
description: "Smart assistant on Campus"
publish_to: 'none'

version: 1.2.2+26

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^2.0.0
  go_router: ^18.1.0
  firebase_core: ^5.0.0
  # cloud_firestore: ^6.1.1
  # firebase_auth: ^6.1.3
  # firebase_storage: ^13.0.5
  google_fonts: ^9.0.0
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  in_app_update: ^5.0.0
  package_info_plus: ^10.2.2
  fluttertoast: ^10.0.2
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  image_cropper: ^13.0.0
  flutter_image_compress: ^2.3.0
  cached_network_image: ^4.0.4
  intl: ^0.20.2
  flutter_staggered_grid_view: ^0.7.0
  youtube_player_flutter: ^10.0.1
  dio: ^5.9.0
  permission_handler: ^13.0.2
  open_filex: ^5.0.0
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  webview_flutter: ^4.13.0
  lucide_icons_flutter: ^4.0.0
  syncfusion_flutter_pdfviewer: ^35.1.37
  dartz: ^0.10.1
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  web_socket_channel: ^3.0.1
  pdfx: ^2.9.2
  collection: ^1.19.1
  timeago: ^3.7.1
  flutter_animate: ^4.5.2
  flutter_map: ^8.3.0
  latlong2: ^0.10.1
  sqflite: ^2.4.3
  path: ^1.9.1
  drift: ^2.22.1
  connectivity_plus: ^7.3.1
  freezed: ^4.0.2
  uuid: ^4.6.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  sqflite_common_ffi_web: ^1.0.2
  google_mobile_ads: ^9.0.0
  pin_code_fields: ^10.1.1
  qr_flutter: ^4.1.0
  gal: ^2.3.3
  web: ^1.1.1
  material_ui: ^1.7.0
  cupertino_ui: ^1.1.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  json_serializable: ^6.9.5
  riverpod_generator: ^4.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.22.1

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  background_color: "#ffffff"

  adaptive_icon_foreground: "assets/launcher/icon_foreground.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_monochrome: "assets/launcher/icon_monochrome.png"

  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
